[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "transcendence-memory-cli"
version = "0.1.0"
description = "Shell CLI for the transcendence-memory self-hosted RAG memory service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "leekkk2" }]
keywords = ["rag", "memory", "cli", "transcendence-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]

dependencies = [
    "httpx>=0.27",
    "typer[all]>=0.12",
    "rich>=13",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/leekkk2/transcendence-memory-server"
Repository = "https://github.com/leekkk2/transcendence-memory-server"
Issues = "https://github.com/leekkk2/transcendence-memory-server/issues"

[project.scripts]
tm = "tm_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["tm_cli"]

[tool.hatch.build.targets.sdist]
include = ["tm_cli", "README.md", "pyproject.toml"]
