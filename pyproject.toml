[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "transcendence-memory-server"
version = "0.21.0"
description = "Self-hosted multimodal RAG memory service with LanceDB + RAG-Anything"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "leekkk2"}]
keywords = ["rag", "memory", "fastapi", "lancedb", "lightrag", "vector-database", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "lancedb>=0.4.0",
    "pyarrow>=12.0.0",
    "lightrag-hku>=1.4.13",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",  # v0.7.0: profiles.yaml 加载需要
    "redis>=5,<6",  # blueprint P0: governance state (config/token/breaker), redis.asyncio. No hiredis (pure-python, avoids native build).
    "apscheduler>=3.10",  # blueprint P6: dreaming background scheduler (AsyncIOScheduler). Code degrades gracefully when absent (lazy import → scheduler stays disabled).
    "cryptography>=42",  # blueprint P1: config_store Fernet at-rest encryption for sensitive config (api_keys:*). Lazy-imported → degrades to plaintext when absent.
]

[project.urls]
Homepage = "https://github.com/leekkk2/transcendence-memory-server"
Repository = "https://github.com/leekkk2/transcendence-memory-server"
Issues = "https://github.com/leekkk2/transcendence-memory-server/issues"

[project.optional-dependencies]
# python-multipart already in main `dependencies`; do not duplicate here.
multimodal = [
    "raganything>=1.2.10",
    "mineru[core]>=3.0.9",
]
dev = ["pytest>=8.0.0", "httpx>=0.24.0"]

[project.scripts]
tm-server = "tm_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
# --ignore=tests/test_cli: cli tests 属于 transcendence-memory-cli 独立 wheel,
# 不在 server test 范围内，由 .github/workflows/publish-cli.yml 单独跑
addopts = "-q --ignore=tests/test_cli"
markers = [
    "integration: tests requiring a live external service (e.g. a real Redis); skipped by default unit runs, run in smoke/integration stage",
]
