# Baseline production-safe compose. Override per-host with docker-compose.override.yml
# (see docker-compose.override.example.yml for the template).
#
# Defaults that differ from older revisions:
#   * port bound to 127.0.0.1 — anyone wanting external access must override
#   * read_only rootfs — writes go to /data, /tmp tmpfs, or /home/tm/.cache tmpfs
#   * pull_policy: always — `docker compose up -d` re-creates after `pull` brings
#     down a new tag, eliminating "I pulled but the old container is still up"
#   * healthcheck uses scripts/healthcheck.py (no curl in image)

services:
  rag-server:
    image: ${TM_IMAGE:?set TM_IMAGE in .env, e.g. docker.io/<your-namespace>/transcendence-memory-server:0.6.1-lite}
    pull_policy: always
    ports:
      - "127.0.0.1:${TM_PORT:-8711}:8711"
    volumes:
      # Persistent server state: LanceDB tables, memory_objects.jsonl, knowledge graphs.
      - tm-data:/data
      # mineru model cache. Lite flavor has no mineru install but the volume mount
      # is harmless (the dir simply stays empty). Keeps deploy commands identical
      # across flavors.
      - mineru-models:/home/tm/.cache/mineru
      # NOTE: external archive bind-mount (rclone, NFS, SSHFS, etc.) is OPT-IN.
      # If you want to feed an existing on-host archive into the RAG index, copy
      # docker-compose.override.example.yml → docker-compose.override.yml and
      # uncomment the rclone-archive volume there.
    env_file:
      - path: .env
        required: false
    environment:
      WORKSPACE: /data
      # Wire the governance Redis layer to the compose-internal redis service by
      # default; override via .env / shell REDIS_URL to point at an external
      # instance. Without this, redis_client._resolve_url() returns None and the
      # whole Redis governance layer silently no-ops (graceful degradation).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      # Redis backs blueprint governance state (config hot-reload, token
      # counters, circuit breakers). It is a soft dependency at the app layer
      # (redis_client degrades gracefully when Redis is down), but waiting for
      # the ping healthcheck here means a fresh `up -d` never races the first
      # config read against an unready Redis.
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${TM_MEM_LIMIT:-3g}
    memswap_limit: ${TM_MEM_LIMIT:-3g}
    mem_reservation: ${TM_MEM_RESERVATION:-1g}
    cpus: ${TM_CPUS:-1.5}
    pids_limit: ${TM_PIDS_LIMIT:-256}
    oom_score_adj: ${TM_OOM_SCORE_ADJ:-500}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /home/tm/.cache:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    # Upstream official image — remote hosts `docker compose pull` it directly,
    # no local/remote build (R1/R5). Pin the 7-alpine line for a small footprint.
    image: redis:7-alpine
    pull_policy: always
    # appendonly + RDB snapshots: governance counters / circuit-breaker TTLs
    # survive a restart. `--save "900 1 300 10"` keeps RDB as a coarse backstop
    # alongside the AOF. No host port published — only the rag-server on the
    # default compose network reaches it (in-cluster, not externally exposed).
    command: ["redis-server", "--appendonly", "yes", "--save", "900 1 300 10"]
    volumes:
      # Redis needs a WRITABLE /data for AOF + RDB. This is why the redis
      # service is NOT read_only (unlike rag-server) — locking its rootfs would
      # break appendonly persistence.
      - redis-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${TM_REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${TM_REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${TM_REDIS_MEM_RESERVATION:-64m}
    cpus: ${TM_REDIS_CPUS:-0.5}
    pids_limit: ${TM_REDIS_PIDS_LIMIT:-128}
    oom_score_adj: ${TM_REDIS_OOM_SCORE_ADJ:-700}
    # NOTE: redis must write /data (AOF/RDB) — do NOT set read_only:true here.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # Persistent application data — LanceDB tables and memory_objects.jsonl live here.
  # NEVER recreate this volume during a normal deploy — that's how memories get lost.
  tm-data:
  # Pre-warmed multimodal model cache (full flavor). Survives image updates so
  # mineru doesn't re-download multi-hundred-MB models on every pull.
  mineru-models:
  # Redis AOF + RDB persistence (governance config, token counters, circuit
  # breakers). NEVER recreate this volume during a normal deploy — that's how
  # the governance state (quota counters, open breakers) gets wiped.
  redis-data:
  # `rclone-archive` (opt-in) is declared in docker-compose.override.example.yml.

