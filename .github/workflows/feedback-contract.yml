name: Feedback contract
on:
  push:
    branches: ['codex/tm-feedback-fixes-*']
  pull_request:
    paths: ['cli-package/**', 'tests/test_cli/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./cli-package[dev]"
      - run: python -m pytest --confcutdir=tests/test_cli -o addopts='' tests/test_cli -q
