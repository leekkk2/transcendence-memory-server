name: Feedback contract
on:
  push:
    branches: ['codex/tm-feedback-fixes-*']
  pull_request:
    paths: ['cli-package/**', 'tests/test_cli/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./cli-package[dev]"
      - run: python -m pytest --confcutdir=tests/test_cli -o addopts='' tests/test_cli -q --junitxml=client-results.xml
      - name: Report contract failures
        if: failure()
        shell: python
        run: |
          import pathlib,xml.etree.ElementTree as ET
          path=pathlib.Path('client-results.xml')
          if path.exists():
              for item in ET.parse(path).iter('testcase'):
                  for kind in ['failure','error']:
                      failure=item.find(kind)
                      if failure is not None:
                          text=(failure.text or '')[-12000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                          print('::error title='+item.get('name','test')+'::'+text)
