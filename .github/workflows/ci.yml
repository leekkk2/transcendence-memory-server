name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  docker-validate:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read           # ← 读 GHCR 上 publish-rag-base 烤好的 registry buildcache
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      # full builds are disk-hungry on the GHA runner — clean up first.
      # Native arm64 runner doesn't need QEMU emulation, but still benefits.
      - name: Free up disk space (full flavor only)
        if: matrix.flavor == 'full'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"/PyPy \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/go || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      # 登录 GHCR 以读 publish-rag-base 烤好的 registry buildcache（rag-base{,-lite}
      # = deps-full 重活所在）。fork 上无 GITHUB_TOKEN packages 权限时该步会失败 →
      # continue-on-error 让其降级为“只用 gha 薄缓存”，不阻断 fork CI。
      - name: Log in to GHCR (read buildcache)
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.flavor }} image (${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tm-${{ matrix.flavor }}
          platforms: ${{ matrix.platform }}
          push: false
          load: false
          # 多源 cache-from：先吃 publish-rag-base 在 GHCR 上烤好的 deps-full 重层
          # （multimodal+mineru，跨 run 持久、无 10GB 上限），命中即跳过 ~70min 重活；
          # 再叠加本服务自己的 gha 薄层缓存（代码/UI 层，易变、量小、适合 gha）。
          # tm-full→rag-base 两个 target 都列进来，让 lite/full 各取所需。
          cache-from: |
            type=registry,ref=ghcr.io/leekkk2/rag-base:buildcache-rag-base
            type=registry,ref=ghcr.io/leekkk2/rag-base:buildcache-rag-base-lite
            type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}
          # 仅把易变薄层写回 gha（mode=min）；重底座层由 publish-rag-base 经 registry
          # 持久，不再往 gha 塞 mode=max 大层（那正是撞 10GB 被驱逐、引发重烤的根因）。
          cache-to: type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }},mode=min
          build-args: |
            TM_VERSION=${{ github.sha }}
            TM_SOURCE_REV=${{ github.sha }}
            # 必须与 publish-rag-base 同传 CPU torch index：rag-base 的多模态/torch RUN 层
            # cache key 含 TORCH_INDEX_URL，不传则走 Dockerfile 默认空值(CUDA) → 与 GHCR 上
            # 烤好的 CPU base 层 cache key 不一致 → 重层 cache MISS、重跑 ~40min pip install。
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu

  build-release-assets:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python distributions
        run: |
          pip install build
          python -m build
      - name: Assemble GitHub release assets
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCKER_IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/transcendence-memory-server
          DOCKER_IMAGE_PLATFORMS: linux/amd64,linux/arm64
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          python scripts/generate_release_assets.py --output-dir release-assets
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: release-assets/*

  publish-pypi:
    needs: [test, build-release-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: github-release-assets
          path: release-assets
      - name: Publish Python distributions
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip twine pkginfo
          # --skip-existing makes the upload idempotent: re-pushing the same
          # tag (e.g. after a publish-docker failure) won't fail here because
          # 0.17.0 already exists on PyPI from the first attempt.
          python -m twine upload --skip-existing release-assets/*.tar.gz release-assets/*.whl

  publish-docker:
    needs: [test, docker-validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read           # ← 读 GHCR 上 publish-rag-base 烤好的 registry buildcache
    strategy:
      fail-fast: false
      # Per-platform matrix: each (flavor × platform) gets its own runner so
      # disk / network / GHA cache API contention is eliminated. arm64 uses the
      # native ubuntu-24.04-arm runner (public-repo free GA, 2026), avoiding
      # QEMU emulation entirely. Without this split, single-step multi-platform
      # publish hits a 6h job timeout (v0.17.0 evidence).
      matrix:
        flavor: [lite, full]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest runner 默认仅 ~14 GB 可用空间，full 镜像（mineru / opencv /
      # raganything 多平台）会爆 "no space left on device"（v0.5.6 实测）。
      # 删除预装的 dotnet/android/ghc/codeql + docker prune 释放 ~30 GB。
      - name: Free up disk space (full flavor only)
        if: matrix.flavor == 'full'
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/PyPy
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/Ruby
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/go
          sudo docker image prune --all --force || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 额外登录 GHCR 仅为读 publish-rag-base 的 registry buildcache（推送目标仍是
      # Docker Hub，见下方 outputs）。tag push 场景 GITHUB_TOKEN 必有 packages:read。
      - name: Log in to GHCR (read buildcache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: tm-${{ matrix.flavor }}
          platforms: ${{ matrix.platform }}
          # Push only platform-specific image by digest — merge-manifests below
          # combines all four (flavor × arch) digests into the canonical
          # multi-arch tags. This avoids the registry-push contention that
          # single-step multi-platform mode triggers.
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/transcendence-memory-server,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TM_VERSION=${{ github.ref_name }}
            TM_SOURCE_REV=${{ github.sha }}
            # 必须与 publish-rag-base 同传 CPU torch index（理由同 docker-validate）：否则
            # rag-base 多模态/torch 重层 cache key 不匹配 → MISS、重跑 5GB CUDA pip install，
            # 既丢提速又让发布镜像偏离已发布的 CPU base。
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          # 多源 cache-from（同 docker-validate 策略）：先吃 publish-rag-base 在 GHCR 上
          # 烤好的 deps-full 重层（跨 run 持久），再叠加本 (flavor×arch) 的 gha 薄层
          # （docker-validate 已写过，本 job 等同带 push 的重放，应近全量命中）。
          # publish-rag-base 与本 job 同属 tag-push 触发；同一 tag 内 base job 先跑完
          # 把重层推上 GHCR，本 job 即命中，无需重跑 pip install / mineru download。
          cache-from: |
            type=registry,ref=ghcr.io/leekkk2/rag-base:buildcache-rag-base
            type=registry,ref=ghcr.io/leekkk2/rag-base:buildcache-rag-base-lite
            type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }}
          # 重底座层经 registry 持久；这里只回写易变薄层到 gha（mode=min），避免大层
          # 再次撞 10GB 上限被 LRU 驱逐。
          cache-to: type=gha,scope=${{ matrix.flavor }}-${{ matrix.arch }},mode=min
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs: publish-docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [lite, full]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.flavor }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="${{ secrets.DOCKERHUB_USERNAME }}/transcendence-memory-server"
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.flavor }}" = "lite" ]; then
            tag_args="-t ${image}:${version}-lite -t ${image}:lite -t ${image}:latest"
          else
            tag_args="-t ${image}:${version}-full -t ${image}:full"
          fi
          # Each filename in /tmp/digests is the digest hex (no sha256: prefix).
          digest_args=$(printf "${image}@sha256:%s " *)
          docker buildx imagetools create $tag_args $digest_args
      - name: Verify manifest
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/transcendence-memory-server"
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "${image}:${version}-${{ matrix.flavor }}"

  github-release:
    needs: [build-release-assets, publish-pypi, merge-manifests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: github-release-assets
          path: release-assets
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets were generated." >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$REPO_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$REPO_NAME" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --repo "$REPO_NAME" --verify-tag --generate-notes --latest
          fi

  # ---------------------------------------------------------------------------
  # publish-rag-base — 发布通用共享基础镜像到 GHCR（公开）。
  #   · 只在 tag push 触发；base 版本由 RAG_BASE_VERSION 决定（与服务 tag 解耦）。
  #   · 用 GITHUB_TOKEN（需 packages: write）登录 ghcr.io，无需额外 secret。
  #   · 多 arch 单步 push（base 改动频率低、可容忍 QEMU；如需提速可仿 publish-docker
  #     拆 per-arch + merge-manifests，本版先用简单形态）。
  #   · 推两个 target：rag-base-lite → ghcr.io/leekkk2/rag-base-lite，
  #                    rag-base      → ghcr.io/leekkk2/rag-base。
  # ---------------------------------------------------------------------------
  publish-rag-base:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ← 关键：GITHUB_TOKEN 默认只读 packages，必须显式提权
    env:
      # base 版本与服务版本解耦：手动维护。命名见目标 spec §2.4。
      RAG_BASE_VERSION: "1.3-py3.13"
      RAG_BASE_REPO: ghcr.io/leekkk2/rag-base
      RAG_BASE_LITE_REPO: ghcr.io/leekkk2/rag-base-lite
      # 跨 run 持久层缓存的 GHCR 后端（registry cache）。base 是 deps-full 重活
      # (multimodal ~5GB + mineru 2.4G) 的唯一“写”方，故由本 job 当缓存生产者。
      # 与发布镜像 tag 分库（:buildcache-rag-base{,-lite}），互不污染。
      RAG_BASE_CACHE_REPO: ghcr.io/leekkk2/rag-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rag-base-lite
            repo_var: RAG_BASE_LITE_REPO
          - target: rag-base
            repo_var: RAG_BASE_REPO
    steps:
      - uses: actions/checkout@v4
      # rag-base 多模态 target 在 GHA runner 上盘紧 → 与 publish-docker 同款清盘。
      - name: Free up disk space (rag-base only)
        if: matrix.target == 'rag-base'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"/PyPy \
            "$AGENT_TOOLSDIRECTORY"/Ruby "$AGENT_TOOLSDIRECTORY"/go || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: docker/setup-qemu-action@v3      # 多 arch 单步 push 需要 QEMU
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # packages:write 由上面 permissions 提供
      - name: Build & push ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env[matrix.repo_var] }}:${{ env.RAG_BASE_VERSION }}
          # ── 跨 run 持久层缓存（根治 deps-full 重烤）────────────────────────────
          # Registry cache 是这里的“真后端”：GHCR blob 无 GHA 的 10GB/repo 硬限、不被
          # LRU 驱逐、跨 job/跨 repo（含 memory-app fork）可共享。mode=max 把所有中间层
          # （deps→deps-full 的 multimodal pip install 层 + mineru bake 2.4G 层 + rag-base
          # 的 pip 增量层）都导出成层缓存，下游 docker-validate/publish-docker 直接命中、
          # 无需再跑 40min pip install / 30min mineru download。
          # gha 仅作同 repo 内的二级 best-effort 命中（薄层），大层靠 registry 兜底。
          cache-from: |
            type=registry,ref=${{ env.RAG_BASE_CACHE_REPO }}:buildcache-${{ matrix.target }}
            type=gha,scope=ragbase-${{ matrix.target }}
          cache-to: |
            type=registry,ref=${{ env.RAG_BASE_CACHE_REPO }}:buildcache-${{ matrix.target }},mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=ragbase-${{ matrix.target }},mode=max
          build-args: |
            TM_VERSION=${{ github.ref_name }}
            TM_SOURCE_REV=${{ github.sha }}
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
      # docker-history 体积断言（Phase 1 必做门禁，见目标 spec §4.2）：确认多模态 diff
      # 纯增量、未被 numpy/pyarrow churn 打折。仅 rag-base target 跑（需对比 lite vs full）。
      - name: Assert rag-base diff stays incremental
        if: matrix.target == 'rag-base'
        run: |
          set -euo pipefail
          # 本地各建一个用于体积比对（同 job 内 buildx 本地层缓存命中，开销小）。
          # rag-base 传与发布同款 CPU torch build-arg，确保断言测的是发布的 CPU 变体。
          TORCH_CPU=https://download.pytorch.org/whl/cpu
          docker build --target rag-base-lite -t ragbl-assert:latest --load .
          docker build --target rag-base --build-arg TORCH_INDEX_URL=$TORCH_CPU -t ragb-assert:latest --load .
          lite_b=$(docker image inspect ragbl-assert:latest --format '{{.Size}}')
          full_b=$(docker image inspect ragb-assert:latest  --format '{{.Size}}')
          diff_gb=$(awk -v a="$full_b" -v b="$lite_b" 'BEGIN{printf "%.2f",(a-b)/1024/1024/1024}')
          echo "rag-base-lite=$((lite_b/1024/1024))MB  rag-base=$((full_b/1024/1024))MB  multimodal_diff=${diff_gb}GB"
          # 断言（DR-048 CPU-torch 后）：lite ≤ 1.2GB；多模态增量 diff 预期 ~1.5GB
          # （CPU torch ~300M + mineru/raganything/opencv/transformers + mineru cache）。
          # 上界 3.5GB 用于捕获"CUDA torch 夹带回归"——CUDA 版会把 diff 推到 ~5GB+。
          awk -v l="$lite_b" 'BEGIN{ if (l > 1.2*1024*1024*1024){ print "FAIL: rag-base-lite >1.2GB"; exit 1 } }'
          awk -v d="$diff_gb" 'BEGIN{ if (d+0 > 3.5){ print "FAIL: multimodal diff >3.5GB (CUDA torch churn? expected CPU ~1.5GB)"; exit 1 }
                                       if (d+0 < 0.7){ print "WARN: multimodal diff <0.7GB (multimodal missing?)" } }'
