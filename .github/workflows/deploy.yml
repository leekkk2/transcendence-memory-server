name: Deploy AWS EVA
on:
  push:
    branches: ['codex/tm-autodeploy-*']
  workflow_run:
    workflows: ['CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-aws-eva
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'leekkk2/transcendence-memory-server' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate deployment credentials and SSH target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          for required in DEPLOY_HOST DEPLOY_SSH_KEY HUB_USER HUB_TOKEN; do
            if [ -z "${!required}" ]; then echo "::error::Missing secret: $required"; exit 1; fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/tm-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tm-ssh/key"
          cp deploy/aws-eva.known_hosts "$RUNNER_TEMP/tm-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/tm-ssh/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o HostKeyAlias=aws-eva-deploy \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tm-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect tm-eva-restored-20260718-rag-server-1 --format '{{.State.Health.Status}}'; python3 -c 'import yaml'"
      - name: Remove temporary SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/tm-ssh"
  publish-and-deploy:
    needs: preflight
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Reject stale or unverified commits
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 deploy/check-release.py "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install pinned image tooling
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard
        run: |
          corepack enable
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard build
      - name: Validate runtime dependencies and publish immutable application image
        id: image
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/tm-registry"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$HUB_TOKEN" | crane auth login index.docker.io --username "$HUB_USER" --password-stdin
          export TM_BASE_IMAGE="$(python3 deploy/check-runtime-base.py)"
          export TM_TARGET_IMAGE="$HUB_USER/transcendence-memory-server:main-$(git rev-parse HEAD)-full"
          export TM_PLATFORM=linux/arm64
          bash scripts/build-runtime-layer.sh
          digest="$(crane digest "$TM_TARGET_IMAGE")"
          printf 'ref=%s@%s\n' "$HUB_USER/transcendence-memory-server" "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy verified image to AWS EVA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE: ${{ steps.image.outputs.ref }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          python3 deploy/check-release.py "$EXPECTED_SHA"
          umask 077
          mkdir -p "$RUNNER_TEMP/tm-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/tm-ssh/key"
          ssh_opts=(-i "$RUNNER_TEMP/tm-ssh/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o HostKeyAlias=aws-eva-deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=deploy/aws-eva.known_hosts)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 - --image '$IMAGE' --revision '$EXPECTED_SHA' --container tm-eva-restored-20260718-rag-server-1 --project tm-eva-restored-20260718 --service-dir /home/ubuntu/services/transcendence-memory-restore-20260718 --public-url https://rags.zweiteng.tk" < deploy/deploy-image.py
      - name: Verify public revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 deploy/verify-public.py https://rags.zweiteng.tk "$EXPECTED_SHA"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/tm-ssh" "$RUNNER_TEMP/tm-registry"
